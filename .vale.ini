StylesPath = styles
MinAlertLevel = warning
Vocab = Spacefast

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Spacefast
; Spacefast.Spelling wraps Vale.Spelling with a technical-term ignore list.
Vale.Spelling = NO

; MDX/ESM lines and self-closing component tags are not prose. Children of
; paired components (<Card>…</Card>) ARE prose and stay linted.
BlockIgnores = (?m)^(?:import|export)\s.+$, (?m)^<[A-Z][A-Za-z]*[^>]*/>$

; Inline component props and template placeholders, plus the one sanctioned
; fixed phrase from the monorepo vocabulary registry: "OAuth access token"
; (protocol vocabulary, not the product credential). Quoted API enum identifiers
; remain identifiers even when the source description doesn't backtick them.
TokenIgnores = (\{[^}\n]+\}), (<[A-Z][A-Za-z]*[^>]*/>), (OAuth access tokens?), ("(?:asc|dt)")

; The changelog is a historical record: shipped release notes keep their
; wording, but public-safety and brand casing still apply retroactively.
[content/(reference)/changelog/**]
BasedOnStyles = Spacefast
Spacefast.Spelling = NO
Spacefast.AISpeak = NO
Spacefast.Hype = NO
Spacefast.Wordiness = NO
Spacefast.Condescension = NO
Spacefast.ApiKey = NO
Spacefast.Hosting = NO
Spacefast.WpCloud = NO
Spacefast.Internals = NO

; Generated error pages and OpenAPI prose are synced snapshots from the product
; source. Keep narrow carve-outs here until the upstream snapshot removes those
; strings, then drop them.
[content/(reference)/errors/**]
BasedOnStyles = Vale, Spacefast
Vale.Spelling = NO
Spacefast.Hosting = NO
Spacefast.ApiKey = NO
Spacefast.Internals = NO

[*openapi-prose.md]
BasedOnStyles = Vale, Spacefast
Vale.Spelling = NO
Spacefast.Hosting = NO

; Generated /connect pages put backticked `npx -y spacefast ...` commands inside
; YAML frontmatter descriptions, where Vale ignores Markdown code spans.
[content/connect/**]
BasedOnStyles = Vale, Spacefast
Vale.Spelling = NO
Spacefast.ProductName = NO
