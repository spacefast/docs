StylesPath = styles
MinAlertLevel = warning
Vocab = Spacefast

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Spacefast
; Spacefast.Spelling wraps Vale.Spelling with a technical-term ignore list.
Vale.Spelling = NO

; MDX/ESM lines and self-closing component tags are not prose. Children of
; paired components (<Card>…</Card>) ARE prose and stay linted.
BlockIgnores = (?m)^(?:import|export)\s.+$, (?m)^<[A-Z][A-Za-z]*[^>]*/>$

; Inline component props and template placeholders, plus the two sanctioned
; fixed phrases from the monorepo vocabulary registry: "built on WP.Cloud"
; (the one licensed provider mention) and "OAuth access token" (protocol
; vocabulary, not the product credential).
TokenIgnores = (\{[^}\n]+\}), (<[A-Z][A-Za-z]*[^>]*/>), (built on WP\.Cloud), (OAuth access tokens?)

; Prose extracted from platform.json fields that the external spec strips.
; The platform API is a sanctioned context for naming the provider.
[*platform-only-prose.md]
Spacefast.WpCloud = NO

; The changelog is a historical record: shipped release notes keep their
; wording, but public-safety and brand casing still apply retroactively.
[content/changelog/**]
BasedOnStyles = Spacefast
Spacefast.Spelling = NO
Spacefast.AISpeak = NO
Spacefast.Hype = NO
Spacefast.Wordiness = NO
Spacefast.Condescension = NO
