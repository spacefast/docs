name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify public safety
        run: bun run verify:public-safety

      - name: Install Vale
        run: |
          curl -sSL https://github.com/vale-cli/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      - name: Verify prose style
        run: bun run verify:prose

      - name: Check types and templates
        run: bun run check

      - name: Validate content and links
        run: bun run validate

      - name: Build static site
        run: bun run build

      - name: Audit built site
        run: bun run audit

      - name: Verify routes and artifacts
        run: bun run verify:routes

  notify-website:
    if: github.server_url == 'https://github.com' && github.repository == 'spacefast/docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint monorepo dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: spacefast
          repositories: monorepo
          permission-contents: write

      - name: Notify the Website publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/spacefast/monorepo/dispatches \
            --field event_type=docs-updated \
            --field "client_payload[repository]=spacefast/docs" \
            --field "client_payload[sha]=$DOCS_SHA"
